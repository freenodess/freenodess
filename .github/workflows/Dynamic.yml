name: Dynamic

on:
  schedule:
    - cron: '0 */8 * * *' 
  workflow_dispatch:     

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Init and Install dependencies
        run: |
          npm init -y
          npm install yaml

      - name: Run dynamic fetcher script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generator.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 👉 核心：先暂存本地改动，拉取最新代码后再恢复，最后再提交推送
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          
          git add output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update dynamic nodes [skip ci]" && git push)
