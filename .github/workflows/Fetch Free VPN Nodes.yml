name: Fetch Free VPN Nodes

on:
  # 每 12 小时自动运行一次
  schedule:
    - cron: '0 */12 * * *'
  # 允许在 GitHub 仓库 Actions 页面手动触发
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予提交代码的权限
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Node Files
        run: |
          mkdir -p nodes
          curl -L -o nodes/clash.yaml 'https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml'
          curl -L -o nodes/v2ray-base64.txt 'https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/v2ray-base64.txt'
          curl -L -o nodes/singbox.json 'https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/singbox.json'

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add nodes/
          # 如果文件内容没有变化，跳过提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update free vpn nodes [skip ci]" && git push)
